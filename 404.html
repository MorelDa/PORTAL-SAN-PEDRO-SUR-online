<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Web cerrada</title>
<style>
html,body{margin:0;padding:0;height:100%}
body{
  background:#090c10;
  color:#e9eef5;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  display:flex;align-items:center;justify-content:center;
  text-align:center;padding:24px;box-sizing:border-box;
}
.box{max-width:620px}
.code{
  font-size:clamp(64px,18vw,120px);font-weight:800;line-height:1;
  color:#1ad7fd;letter-spacing:.06em;
}
.titulo{
  font-size:clamp(22px,6vw,36px);font-weight:700;letter-spacing:.14em;
  color:#e2fa10;margin:14px 0 26px;
}
.txt{font-size:clamp(16px,4.5vw,20px);margin:8px 0;line-height:1.5}
.pie{margin-top:38px;font-size:13px;color:#7c8a99}
</style>
</head>
<body>
<main class="box">
  <div class="code">404</div>
  <div class="titulo">WEB CERRADA</div>
  <p class="txt">Web cerrada por el desarrollador DJ Kevin.</p>
  <p class="txt">Comun&iacute;quese con el desarrollador.</p>
  <div class="pie">Portal San Pedro Sur</div>
</main>
</body>
</html>
